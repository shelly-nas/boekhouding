name: Deploy to Acceptance

# Elke pull request naar main die de app raakt, wordt gebouwd en gedeployd naar
# boekhouding-acc.shelly-nas.nl, zodat de wijziging in de draaiende app te
# bekijken is vóór de merge. Er is één acc: de laatst gepushte PR staat erop.
# "Run workflow" zet een willekeurige branch er met de hand op.
#
# Acc krijgt bij elke deploy een verse database (init.sql, de aanvullingen en
# de migraties van de PR) en nooit productiedata. Bij het sluiten of mergen van
# de PR wordt acc opgeruimd, tenzij er intussen een andere PR op staat.
#
# De app staat in app/; de rest van de repo is de vastlegging (markdown). Een
# PR die alleen die vastlegging wijzigt, heeft op acc niets te bekijken.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'app/**'
      - '.github/workflows/acc.yml'
  workflow_dispatch:

permissions:
  contents: read

# Een nieuwere push vervangt een lopende deploy; acc toont maar één branch.
# Een teardown breekt nooit een deploy af: hij wacht zijn beurt af in dezelfde
# groep en ruimt acc daarna alleen op als de deploy die draaide van deze PR was.
# (Een eigen groep zou hem tegelijk met de deploy van een andere PR laten lopen,
# en dan haalt hij de map onder die deploy weg.)
concurrency:
  group: acc-deploy
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  prepare:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    # Release-PR's hogen alleen versies en de changelog op; niets te bekijken.
    # PR's uit forks komen nooit op de self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
       !startsWith(github.head_ref, 'release-please--') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=acc-${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build and Push Server
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/boekhouding-server:${{ needs.prepare.outputs.tag }}
      context: ./app/server
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-client:
    name: Build and Push Client
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/boekhouding-client:${{ needs.prepare.outputs.tag }}
      context: ./app/client
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-db:
    name: Build and Push Database
    needs: prepare
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/boekhouding-db:${{ needs.prepare.outputs.tag }}
      context: ./app/database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-acc:
    name: Deploy to Acceptance
    needs: [prepare, build-server, build-client, build-db]
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-acceptance.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/boekhouding-acc
      compose_file: app/docker-compose.acc.yml
      image_tag: ${{ needs.prepare.outputs.tag }}
      # Geen aparte demodata: init.sql en de aanvullingen in het db-image
      # leveren de stamdata al, net als bij een nieuwe installatie.
      demo_seed_file: ''
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME }}
        DB_USER=${{ vars.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        TZ=${{ vars.TZ || 'Europe/Amsterdam' }}

  teardown-acc:
    name: Tear down Acceptance
    if: >-
      github.event.action == 'closed' &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: shelly-nas/shared-workflows/.github/workflows/teardown-acceptance.yml@main
    with:
      acc_directory: /volume1/docker/boekhouding-acc
      commit: ${{ github.event.pull_request.head.sha }}
