server {
  listen 80;
  root /usr/share/nginx/html;

  # Lokaal is er geen Traefik: /api gaat via nginx naar de server. In productie
  # routeert Traefik /api rechtstreeks naar de server en komt het hier niet.
  location /api/ {
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=10s;
    set $server http://server:3000;
    proxy_pass $server;
  }

  location / {
    try_files $uri /index.html;
  }
}
